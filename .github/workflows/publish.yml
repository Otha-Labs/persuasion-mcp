# A version that lands on main publishes itself: first to npm through trusted publishing, which needs no stored token, then to
# the MCP registry. Each step runs only when its target does not have this version yet, so a rerun or a merge with no version
# bump publishes nothing. The registry step waits, with a warning, until the MCP_PRIVATE_KEY secret exists.
name: Publish

on:
  push:
    branches: [main]
  # A daily run publishes whatever an earlier run had to leave, such as a registry entry that waited for its key.
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check that every version agrees
        run: node scripts/check-versions.mjs

      - name: Find what is new
        id: new
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          server="$(node -p "require('./server.json').name")"
          npm_new=true
          if npm view "$name@$version" version >/dev/null 2>&1; then npm_new=false; fi
          query="$(SERVER="$server" node -p 'encodeURIComponent(process.env.SERVER)')"
          listed="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$query" | SERVER="$server" VERSION="$version" node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const all = (JSON.parse(s).servers ?? []).map((x) => x.server ?? x)
              console.log(all.some((x) => x.name === process.env.SERVER && x.version === process.env.VERSION))
            })')"
          registry_new=true
          if [ "$listed" = "true" ]; then registry_new=false; fi
          echo "npm=$npm_new" >> "$GITHUB_OUTPUT"
          echo "registry=$registry_new" >> "$GITHUB_OUTPUT"
          echo "$name $version is new on npm: $npm_new. $server $version is new on the registry: $registry_new."

      - name: Install
        if: steps.new.outputs.npm == 'true'
        run: npm ci

      # prepublishOnly builds, runs both smoke tests and the voice check, so a broken build never publishes.
      - name: Publish to npm
        if: steps.new.outputs.npm == 'true'
        run: npm publish --access public

      # npm can take a minute or two to serve a version it has just accepted, and the registry checks that the version is on
      # npm, so the registry step waits for it. On 2026-11-10 the registry step ran 4 seconds after npm accepted 1.0.5 and
      # was refused with a 404, and the entry needed a second run by hand.
      - name: Wait until npm serves this version
        if: steps.new.outputs.registry == 'true'
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 40); do
            if npm view --prefer-online "$name@$version" version >/dev/null 2>&1; then
              echo "npm serves $name $version."
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm still does not serve $name $version after 10 minutes, so the registry entry waits for the next run."
          exit 1

      - name: Install cosign
        if: steps.new.outputs.registry == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish to the MCP registry
        if: steps.new.outputs.registry == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_PRIVATE_KEY}" ]; then
            echo "::warning::The MCP_PRIVATE_KEY secret is not set, so the registry entry waits. Run this workflow again once it is."
            exit 0
          fi
          # The registry checks the key against coppica.com, so the step waits until the site serves this key's public half.
          served="$(curl -fsS https://coppica.com/.well-known/mcp-registry-auth || true)"
          ours="$(node -e '
            const c = require("crypto")
            const der = Buffer.concat([Buffer.from("302e020100300506032b657004220420", "hex"), Buffer.from(process.env.MCP_PRIVATE_KEY, "hex")])
            const x = c.createPublicKey(c.createPrivateKey({ key: der, format: "der", type: "pkcs8" })).export({ format: "jwk" }).x
            console.log(Buffer.from(x, "base64url").toString("base64"))')"
          if ! printf '%s' "$served" | grep -qF "p=${ours}"; then
            echo "::warning::coppica.com does not serve this key's public half yet, so the registry entry waits for the next run."
            exit 0
          fi
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login http --domain coppica.com --private-key "${MCP_PRIVATE_KEY}"
          ./mcp-publisher publish
